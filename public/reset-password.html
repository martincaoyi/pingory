<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title data-i18n="meta.title.reset">Reset Password · Pingory</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="icon" href="/favicon-32.png" type="image/png" sizes="32x32">
  <link rel="shortcut icon" href="/favicon.ico">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <link rel="manifest" href="/site.webmanifest">
  <script>try{const th=localStorage.getItem('pingory_theme');if(th)document.documentElement.dataset.theme=th;}catch(e){}</script>
  <style>
    :root { --bg:#f5f8f6; --bg-2:#eef3f0; --card:#ffffff; --card-2:#f1f8f3; --border:#dbe4df; --accent:#1faa6b; --accent-soft:rgba(31,170,107,0.10); --accent-line:rgba(31,170,107,0.30); --text:#16241d; --muted:#5d6b63; --nav-bg:rgba(245,248,246,0.92); --danger:#e5484d; }
    [data-theme="dark"] { --bg:#0e1310; --bg-2:#151b17; --card:#161d18; --card-2:#1e261f; --border:#2a322c; --text:#e6efe9; --muted:#9fb0a6; --accent:#2bd585; --accent-soft:rgba(43,213,133,0.14); --accent-line:rgba(43,213,133,0.42); --nav-bg:rgba(14,19,16,0.92); --danger:#ff6b6b; }
    [data-theme="dark"] input, [data-theme="dark"] select, [data-theme="dark"] textarea { background:var(--bg-2); }
    * { box-sizing: border-box; }
    body { margin:0; min-height:100vh; font-family:-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif; background:var(--bg); color:var(--text); display:flex; flex-direction:column; align-items:center; justify-content:center; padding:80px 20px; }
    .brand { color:var(--accent); font-weight:700; font-size:1.4rem; text-decoration:none; margin-bottom:24px; display:inline-flex; align-items:center; gap:10px; }
    .card { background:var(--card); border:1px solid var(--border); border-radius:12px; padding:28px; width:100%; max-width:380px; }
    .card h1 { margin:0 0 4px; font-size:1.5rem; }
    .card .sub { color:var(--muted); font-size:.9rem; margin:0 0 20px; }
    label { display:block; font-size:.8rem; color:var(--muted); margin:14px 0 6px; }
    input { width:100%; padding:11px 12px; border-radius:8px; border:1px solid var(--border); background:var(--bg-2); color:var(--text); font-size:.95rem; }
    button.primary { width:100%; margin-top:20px; padding:12px; border:0; border-radius:8px; font-size:1rem; font-weight:600; cursor:pointer; background:var(--accent); color:#fff; }
    button.primary:hover { opacity:.9; }
    .msg { color:var(--danger); font-size:.85rem; min-height:1.2em; margin-top:10px; }
    .alt { text-align:center; color:var(--muted); font-size:.88rem; margin-top:18px; }
    .alt a { color:var(--accent); text-decoration:none; }
    .home { position:fixed; top:0; left:0; right:0; padding:12px 24px; border-bottom:1px solid var(--border); background:var(--nav-bg); display:flex; align-items:center; justify-content:space-between; }
    .home a { color:var(--accent); font-weight:700; text-decoration:none; font-size:1.1rem; }
    .lang { margin-left:auto; }
    .lang select { padding:5px 8px; border-radius:6px; border:1px solid var(--border); background:var(--bg); color:var(--text); font-size:.85rem; }
  </style>
</head>
<body>
  <div class="home">
    <a href="/">Pingory</a>
    <button id="themeToggle" title="Toggle dark mode" style="border:1px solid var(--border);background:transparent;color:var(--text);cursor:pointer;font-size:1.05rem;border-radius:6px;padding:4px 8px;margin-left:8px;">🌙</button>
    <span class="lang"><select id="langSel"></select></span>
  </div>
  <a href="/" class="brand"><svg width="30" height="30" viewBox="0 0 64 64" aria-hidden="true"><rect x="2" y="2" width="60" height="60" rx="14" fill="var(--accent)"/><circle cx="32" cy="32" r="5.5" fill="#fff"/><path d="M32 17.5 a14.5 14.5 0 0 1 14.5 14.5" stroke="#fff" stroke-width="4.5" fill="none" stroke-linecap="round"/><path d="M32 8.5 a23.5 23.5 0 0 1 23.5 23.5" stroke="rgba(255,255,255,.5)" stroke-width="4.5" fill="none" stroke-linecap="round"/></svg><span>Pingory</span></a>
  <div class="card">
    <h1 data-i18n="reset.title">Reset Password</h1>
    <p class="sub" id="sub"></p>
    <form id="resetForm" style="display:none">
      <label for="np" data-i18n="reset.newPw">New password</label>
      <input type="password" id="np" autocomplete="new-password" required />
      <label for="np2" data-i18n="reset.confirmPw">Confirm new password</label>
      <input type="password" id="np2" autocomplete="new-password" required />
      <button type="submit" class="primary" data-i18n="reset.submit">Set new password</button>
      <div class="msg" id="msg"></div>
    </form>
    <form id="reqForm" style="display:none">
      <label for="email" data-i18n="signin.email">Email</label>
      <input type="email" id="email" placeholder="you@example.com" autocomplete="username" required />
      <button type="submit" class="primary" data-i18n="reset.send">Send reset link</button>
      <div class="msg" id="msg2"></div>
    </form>
    <div class="alt"><a href="/signin.html" data-i18n="reset.back">Back to Sign In</a></div>
  </div>

  <script src="/pw-toggle.js"></script>
  <script>
    const I18N_LANGS = [['en','English'],['zh','中文'],['es','Español'],['pt','Português'],['de','Deutsch'],['fr','Français'],['ja','日本語'],['ko','한국어']];
    let I18N = {};
    function t(key, def, vars) {
      let s = (I18N && I18N[key]) || def;
      if (vars) { for (const k in vars) s = s.split('{' + k + '}').join(vars[k]); }
      return s;
    }
    function errMsg(d) {
      if (typeof d === 'string') return d;
      if (!d || !d.error) return '';
      let s = t('err.' + d.error, d.error);
      if (d.ep) { const ep = Object.assign({}, d.ep); if (ep.plan !== undefined) ep.plan = t('plan.' + ep.plan, ep.plan); s = s.replace(/\{(\w+)\}/g, (m, k) => (ep[k] !== undefined ? ep[k] : m)); }
      return s;
    }
    async function loadI18n(lang){
      try { const r = await fetch('/i18n/'+lang+'.json'); I18N = await r.json(); } catch { I18N = {}; }
      try { localStorage.setItem('pingory_lang', lang); } catch {}
      applyI18n();
    }
    function applyI18n(){
      document.querySelectorAll('[data-i18n]').forEach((el)=>{ const k = el.getAttribute('data-i18n'); if (I18N[k]) el.textContent = I18N[k]; });
      document.documentElement.lang = (function(){ try { return localStorage.getItem('pingory_lang')||'en'; } catch { return 'en'; } })();
      renderSub();                                   // 副标题是动态文案，必须随语言重绘
      if (typeof window.__pwToggleRefresh === 'function') window.__pwToggleRefresh();
    }
    function langSwitcher(){
      let cur='en'; try { cur = localStorage.getItem('pingory_lang')||'en'; } catch {}
      const sel = document.getElementById('langSel');
      sel.innerHTML = I18N_LANGS.map(([c,n])=>`<option value="${c}" ${c===cur?'selected':''}>${n}</option>`).join('');
      sel.onchange = ()=> loadI18n(sel.value);
    }
    const token = new URLSearchParams(location.search).get('token');
    const resetForm = document.getElementById('resetForm');
    const reqForm = document.getElementById('reqForm');
    const sub = document.getElementById('sub');
    // 副标题文案：① i18n 就绪后再设置（此处脚本先于 loadI18n 执行，直接写会永远显示英文）
    //            ② 挂进 applyI18n，切换语言时同步刷新（历史 bug：切语言后副标题不跟随）
    function renderSub(){
      if (!sub) return;
      if (token) { resetForm.style.display=''; sub.textContent = t('reset.subToken','Enter a new password for your account.'); }
      else { reqForm.style.display=''; sub.textContent = t('reset.subEmail','Enter your email and we will send a reset link.'); }
    }

    resetForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      const msg = document.getElementById('msg'); msg.textContent = '';
      const np = document.getElementById('np').value;
      const np2 = document.getElementById('np2').value;
      if (np.length < 8) { msg.textContent = t('reset.pwShort','Password must be at least 8 characters'); return; }
      if (np !== np2) { msg.textContent = t('reset.mismatch','Passwords do not match'); return; }
      const btn = resetForm.querySelector('button'); btn.disabled = true;
      try {
        const res = await fetch('/api/auth/reset-password', { method:'POST', credentials:'same-origin', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ token, newPassword: np }) });
        const d = await res.json();
        if (!res.ok) { msg.textContent = errMsg(d) || t('reset.fail','Reset failed'); btn.disabled = false; return; }
        msg.style.color = 'var(--accent)'; msg.textContent = t('reset.success','Password updated. You can now sign in.');
        setTimeout(()=>{ location.href = '/signin.html'; }, 1500);
      } catch { msg.textContent = t('reset.network','Network error, please retry'); btn.disabled = false; }
    });

    reqForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      const msg = document.getElementById('msg2'); msg.textContent = '';
      const email = document.getElementById('email').value.trim();
      const btn = reqForm.querySelector('button'); btn.disabled = true;
      try {
        const res = await fetch('/api/auth/forgot-password', { method:'POST', credentials:'same-origin', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ email }) });
        const d = await res.json();
        if (!res.ok) { msg.textContent = errMsg(d) || t('reset.fail','Request failed'); btn.disabled = false; return; }
        msg.style.color = 'var(--accent)'; msg.textContent = t('reset.sent','If the email exists, a reset link has been sent');
        btn.disabled = false;
      } catch { msg.textContent = t('reset.network','Network error, please retry'); btn.disabled = false; }
    });

    (async ()=>{
      let saved='en'; try { saved = localStorage.getItem('pingory_lang')||'en'; } catch {}
      document.documentElement.lang = saved;
      const tt = document.getElementById('themeToggle');
      function syncThemeIcon(){ if(tt) tt.textContent = document.documentElement.dataset.theme === 'dark' ? '☀️' : '🌙'; }
      if (tt) tt.addEventListener('click', () => {
        const dark = document.documentElement.dataset.theme === 'dark';
        if (dark) document.documentElement.removeAttribute('data-theme'); else document.documentElement.dataset.theme = 'dark';
        try { localStorage.setItem('pingory_theme', dark ? '' : 'dark'); } catch {}
        syncThemeIcon();
      });
      syncThemeIcon();
      await loadI18n(saved);
      langSwitcher();
    })();
  </script>
<script src="/analytics.js"></script>
</body>
</html>
