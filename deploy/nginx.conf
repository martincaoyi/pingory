# Pingory 生产反代示例（传统 VPS + Nginx + Let's Encrypt）
# 放到 /etc/nginx/sites-available/pingory，软链到 sites-enabled，nginx -t && systemctl reload nginx
#
# 主域名 pingory.com（应用）
server {
    listen 80;
    server_name pingory.com www.pingory.com;
    # 让 certbot 申请证书（ACME 挑战）
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl http2;
    server_name pingory.com www.pingory.com;

    ssl_certificate     /etc/letsencrypt/live/pingory.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/pingory.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    # 私有状态页密码 cookie 等需要跨代理保留
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_read_timeout 60s;
    }
}

# 自定义状态页域名（G7）：CNAME 指向本 VPS，证书单独申请
# server_name status.yourclient.com; 其余同上，proxy_pass 同 127.0.0.1:3000
# 注：Fly.io 部署时证书由 fly 自动签发，无需此配置；自定义域名在 fly 控制台加 host + CNAME 即可。
