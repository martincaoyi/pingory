# Fly.io 部署配置（Uptime Monitor 常驻后端）
# 用法：
#   1. 安装 flyctl：https://fly.io/docs/handbook/installing/
#   2. fly auth signup（或 fly auth login，需信用卡验身）
#   3. fly launch --no-deploy   # 生成 app 名，本文件已就绪
#   4. fly secrets set $(cat .env | grep -v '^#' | xargs)   # 把 .env 全部设为机密
#   5. fly deploy
# 注意：secret 不能写在 toml 里，务必用 fly secrets set。
app = "uptime-monitor-martin"
primary_region = "nrt"   # 东京节点，离大陆近；可改 sin(新加坡)/hkg(香港)
build = { dockerfile = "Dockerfile" }

[env]
  PORT = "3000"
  NODE_ENV = "production"

[[services]]
  internal_port = 3000
  protocol = "tcp"
  [[services.ports]]
    handlers = ["http"]
    port = 80
  [[services.ports]]
    handlers = ["tls", "http"]
    port = 443

[vm]
  cpu_kind = "shared"
  cpus = 1
  # 2026-09-23：256 → 512。当日实测一台机器 exit_code=137 + oom_killed=true（内核 OOM），
  # 256MB 下 V8 堆 + Buffer/网络缓冲/原生内存叠加很容易触顶，触顶即被内核杀掉（不是可控的 GC 抖动）。
  # 配合 Dockerfile 的 --max-old-space-size=384：堆到 384 就先 GC/报错，给非堆内存留 128MB。
  # ⚠️ 成本影响：Fly 按内存计费，512MB 约比 256MB 贵一倍（每台约 +$1~2/月，两台约 +$2~4/月）。
  # 若要退回免费/最低配，把下面改回 256 并同步把 Dockerfile 的堆上限降到 192（否则更容易 OOM）。
  memory_mb = 512
